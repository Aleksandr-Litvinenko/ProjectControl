# ProjectControl — продакшн-стек.
#
# ВАЖНО (особенность сервера projectcrm.ru): на этом хосте сломана предопределённая
# bridge-сеть Docker и встроенный DNS (127.0.0.11) — контейнеры не резолвят друг друга
# по именам сервисов. Поэтому api и web работают в host-сети (как и соседний проект на
# этом сервере). БД остаётся в bridge с публикацией порта 127.0.0.1:5433 (публикация
# портов работает независимо от встроенного DNS). См. DECISIONS D15.
#
# Внешний доступ и TLS даёт host-nginx: projectcrm.ru -> 127.0.0.1:8080 (web) -> /api -> 127.0.0.1:4000 (api).
name: projectcontrol

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pc_db_data:/var/lib/postgresql/data
    # Публикуем на loopback — сюда же ходит api (в host-сети) и psql с хоста.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: projectcontrol-api
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    network_mode: host
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # В host-сети до БД ходим через опубликованный порт на loopback.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5433/${POSTGRES_DB}?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      API_PORT: "4000"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      STORAGE_DIR: /app/storage
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      HEALTH_DEADLINE_SOON_DAYS: ${HEALTH_DEADLINE_SOON_DAYS:-7}
      HEALTH_OVERLOAD_YELLOW_PCT: ${HEALTH_OVERLOAD_YELLOW_PCT:-100}
      HEALTH_OVERLOAD_RED_PCT: ${HEALTH_OVERLOAD_RED_PCT:-120}
    volumes:
      - pc_storage:/app/storage

  web:
    image: projectcontrol-web
    build:
      context: ./apps/web
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    restart: unless-stopped
    depends_on:
      - api
    network_mode: host

volumes:
  pc_db_data:
  pc_storage:
