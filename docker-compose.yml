# ProjectControl — продакшн-стек.
# Все порты слушаются ТОЛЬКО на 127.0.0.1: внешний доступ и TLS даёт host-nginx,
# который проксирует projectcrm.ru -> 127.0.0.1:8080 (web) -> /api -> api:4000.
name: projectcontrol

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pc_db_data:/var/lib/postgresql/data
    # Локальный порт для отладки/psql с хоста (не публичный)
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      API_PORT: "4000"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      STORAGE_DIR: /app/storage
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      HEALTH_DEADLINE_SOON_DAYS: ${HEALTH_DEADLINE_SOON_DAYS:-7}
      HEALTH_OVERLOAD_YELLOW_PCT: ${HEALTH_OVERLOAD_YELLOW_PCT:-100}
      HEALTH_OVERLOAD_RED_PCT: ${HEALTH_OVERLOAD_RED_PCT:-120}
    volumes:
      - pc_storage:/app/storage
    ports:
      - "127.0.0.1:4000:4000"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pc_db_data:
  pc_storage:
