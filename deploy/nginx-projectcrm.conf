# ProjectControl — projectcrm.ru
# Провайдер (Jino) терминирует публичный HTTPS своим wildcard-сертификатом и
# проксирует на origin:80. Поэтому НЕ редиректим на https на origin — отдаём контент
# на :80. Блок :443 с Let's Encrypt оставлен для прямого доступа по IP/домену.
# Соседние сайты game.* / gamecodex.* не затрагиваются.

# Общий прокси на web-контейнер
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name projectcrm.ru www.projectcrm.ru _;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name projectcrm.ru www.projectcrm.ru;

    ssl_certificate /etc/letsencrypt/live/projectcrm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projectcrm.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
    }
}
