# ProjectControl — host-nginx сайт для projectcrm.ru.
# Внешний reverse-proxy + TLS. Проксирует на web-контейнер (127.0.0.1:8080).
# Установка: см. README раздел «Деплой». Соседние сайты (game.*, gamecodex.*) не трогаем.
#
# certbot --nginx -d projectcrm.ru -d www.projectcrm.ru   # добавит 443-блок и редирект.

server {
    listen 80;
    listen [::]:80;
    server_name projectcrm.ru www.projectcrm.ru;

    # ACME-челлендж Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }
}
